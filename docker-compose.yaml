services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: immersion-postgres
    environment:
      POSTGRES_USER: immersion
      POSTGRES_PASSWORD: immersion
      POSTGRES_DB: immersion_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
